name: ece573-prj03

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-course-password
    volumes:
      - marketplace-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  login-service:
    build:
      target: login
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-course-password
      JWT_PRIVATE_KEY_FILE: /run/secrets/private.pem
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
    volumes:
      - ./secrets/private.pem:/run/secrets/private.pem:ro
      - ./secrets/admin-password:/run/secrets/admin-password:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  marketplace-service:
    build:
      target: marketplace
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-course-password
      JWT_PUBLIC_KEY_FILE: /run/secrets/public.pem
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
    volumes:
      - ./secrets/public.pem:/run/secrets/public.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  marketplace-data:
