name: ece573-prj04

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-course-password
    volumes:
      - marketplace-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  login-service:
    build:
      target: login
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-course-password
      JWT_PRIVATE_KEY_FILE: /run/secrets/private.pem
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
    volumes:
      - ./secrets/private.pem:/run/secrets/private.pem:ro
      - ./secrets/admin-password:/run/secrets/admin-password:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  marketplace-service:
    build:
      target: marketplace
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-course-password
      JWT_PUBLIC_KEY_FILE: /run/secrets/public.pem
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      CASSANDRA_CONTACT_POINTS: cassandra-1,cassandra-2
      READ_CONSISTENCY: ${READ_CONSISTENCY:-QUORUM}
      WRITE_CONSISTENCY: ${WRITE_CONSISTENCY:-QUORUM}
    volumes:
      - ./secrets/public.pem:/run/secrets/public.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  cassandra-1:
    image: cassandra:4.1.7
    environment:
      CASSANDRA_CLUSTER_NAME: ece573-shopping-prj04
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra-1-data:/var/lib/cassandra

  cassandra-2:
    extends:
      service: cassandra-1
    volumes:
      - cassandra-2-data:/var/lib/cassandra

  cassandra-3:
    extends:
      service: cassandra-1
    volumes:
      - cassandra-3-data:/var/lib/cassandra

volumes:
  marketplace-data:
  cassandra-1-data:
  cassandra-2-data:
  cassandra-3-data:
