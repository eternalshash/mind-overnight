<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE 441 Smart HVAC - Blueprint Digital Twin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07152b; --grid1:rgba(56,189,248,.20); --grid2:rgba(56,189,248,.06);
  --cyan:#38bdf8; --accent:#00e5ff; --panel:#0b1b34; --card:#11264a; --border:#1f3d6b;
  --text:#dbe7f5; --muted:#7f97b8; --red:#ef4444; --amber:#f59e0b; --green:#10b981;
  --mono:'SF Mono',Menlo,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;overflow:hidden}
header{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid var(--cyan);background:#081a33}
.title{display:flex;gap:12px;align-items:center}
.badge{border:1px solid var(--cyan);color:var(--accent);padding:2px 8px;font-size:10px;letter-spacing:1px;white-space:nowrap}
.badge.warn{border-color:var(--amber);color:var(--amber)} .badge.crit{border-color:var(--red);color:var(--red)}
.title h1{font-size:14px;letter-spacing:1px;color:#fff}
.hstat{display:flex;gap:18px;font-size:11px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--green);box-shadow:0 0 6px currentColor}
main{flex:1;display:flex;min-height:0}

/* LEFT: ROOM */
#roomSec{flex:1 1 50%;position:relative;border-right:2px solid var(--border);min-width:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid1) 1px,transparent 1px),linear-gradient(90deg,var(--grid1) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
#bp{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.toolbar{position:absolute;top:10px;left:12px;z-index:3;background:rgba(7,21,43,.9);border:1px solid var(--border);padding:5px 10px;font-size:10px;color:var(--cyan)}
#toasts{position:absolute;top:44px;right:12px;z-index:6;width:330px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(9,20,40,.97);border:1px solid var(--border);border-left:4px solid var(--cyan);padding:8px 10px;animation:tin .25s ease-out;transition:opacity .5s}
.toast.crit{border-left-color:var(--red);box-shadow:0 0 16px rgba(239,68,68,.35)}
.toast.warn{border-left-color:var(--amber)} .toast.ok{border-left-color:var(--green)}
.toast .t0{font-size:9px;letter-spacing:1px;color:var(--muted)}
.toast .t1{font-weight:bold;font-size:11px;margin-top:2px}
.toast.crit .t1{color:#fca5a5} .toast.warn .t1{color:#fcd34d} .toast.ok .t1{color:#6ee7b7}
.toast .t2{color:var(--muted);font-size:10px;margin-top:3px;line-height:1.35}
.toast .t3{color:var(--accent);font-size:10px;margin-top:3px;line-height:1.35}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#statusBar{position:absolute;left:12px;right:12px;bottom:10px;z-index:3;background:rgba(9,20,40,.95);border:1px solid var(--border);border-left:4px solid var(--green);padding:7px 12px;display:flex;justify-content:space-between;gap:12px;font-size:11px}
#statusBar.warn{border-left-color:var(--amber)} #statusBar.crit{border-left-color:var(--red)} #statusBar.info{border-left-color:var(--cyan)}
#sbD{color:var(--muted);font-size:10px;margin-top:2px}
#sbR{text-align:right;font-size:10px;color:var(--muted);line-height:1.5;white-space:nowrap}

/* RIGHT */
#side{flex:1 1 50%;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.pane-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.pane-t{color:var(--accent);letter-spacing:1px;font-size:11px;text-transform:uppercase;white-space:nowrap}
#tele{flex:0 0 auto;padding:10px 14px;border-bottom:2px solid var(--border)}
.tabs{display:flex;gap:2px;border:1px solid var(--border);padding:2px;background:#081629}
.tab{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 9px;cursor:pointer;letter-spacing:.5px}
.tab:hover{color:#fff} .tab.on{background:var(--cyan);color:#06142a;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--border);padding:6px 8px;min-width:0}
.card .l{font-size:9px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .v{font-size:18px;font-weight:bold;color:#fff;margin-top:2px;white-space:nowrap}
.card .v small{font-size:10px;color:var(--cyan);font-weight:normal;margin-left:3px}
.card .s{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.warn{border-color:var(--amber)} .card.crit{border-color:var(--red)}
.card.warn .v{color:#fcd34d} .card.crit .v{color:#fca5a5}
.chartbox{position:relative;height:210px;background:#081629;border:1px solid var(--border);padding:6px}
#bottom{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.col{padding:10px 12px;overflow-y:auto;min-height:0}
.col+.col{border-left:1px solid var(--border)}
.grp{margin-bottom:8px}
.grp-h{font-size:9px;color:var(--muted);letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:3px;margin:4px 0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px;border:1px solid transparent;cursor:pointer;user-select:none}
.frow:hover{background:rgba(56,189,248,.07);border-color:var(--border)}
.frow .nm{font-size:11px;color:#fff}
.frow .ds{font-size:9px;color:var(--muted);margin-top:1px}
.frow.on{background:rgba(245,158,11,.10);border-color:var(--amber)}
.frow .st{font-size:8px;color:var(--amber);letter-spacing:1px;margin-top:2px;display:none}
.frow.on .st{display:block}
.sw{flex:0 0 30px;height:14px;border:1px solid var(--muted);position:relative}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;background:var(--muted);transition:left .15s}
.frow.on .sw{border-color:var(--amber)} .frow.on .sw::after{left:18px;background:var(--amber)}
.btn{width:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:10px;padding:6px;cursor:pointer;letter-spacing:1px}
.btn:hover{border-color:var(--cyan);color:#fff}
.sl{margin-top:6px}
.sl .h{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
.sl .h b{color:var(--cyan)}
input[type=range]{width:100%;accent-color:var(--cyan);height:14px}
.mcu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.mbox{border:1px solid var(--border);padding:6px;background:var(--card)}
.mbox .n{font-size:9px;color:var(--muted)}
.mbox .st{font-size:12px;font-weight:bold;margin-top:2px}
.mbox .hb{font-size:9px;color:var(--muted);margin-top:2px}
.mbox.ok{border-color:var(--green)} .mbox.bad{border-color:var(--red)} .mbox.stby{border-color:var(--amber)}
.bar{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:6px;font-size:10px;margin:3px 0}
.bar .tr{height:8px;background:#081629;border:1px solid var(--border);position:relative}
.bar .fl{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);transition:width .2s}
.bar .vv{text-align:right;color:#fff;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:10px;margin-top:4px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){color:#fff;text-align:right}
.fi{border:1px solid var(--border);border-left:3px solid var(--amber);padding:5px 7px;margin-bottom:5px;background:rgba(17,38,74,.6)}
.fi.crit{border-left-color:var(--red)} .fi.info{border-left-color:var(--cyan)}
