<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart HVAC 3D Digital Twin</title>
    <!-- Include Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include MQTT.js for WebSocket Telemetry -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <!-- Include Chart.js for Live Data Plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; height: 100vh; overflow: hidden; }
        #left-panel { width: 50%; height: 100%; position: relative; border-right: 1px solid #334155; }
        #right-panel { width: 50%; height: 100%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; background: #0b1120;}
        #canvas-container { width: 100%; height: 100%; }
        .card { background: #1e293b; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .chart-container { flex: 1; min-height: 0; position: relative; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.2rem;}
        .metric { font-size: 2.2rem; font-weight: bold; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #status { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px; z-index: 10; font-size: 0.9rem; font-weight: bold; border: 1px solid #334155;}
        #title-overlay { position: absolute; bottom: 20px; left: 20px; z-index: 10; pointer-events: none;}
        #title-overlay h1 { margin: 0; font-size: 1.5rem; color: #f8fafc; }
        #title-overlay p { margin: 5px 0 0 0; color: #94a3b8; }
    </style>
</head>
<body>

<div id="left-panel">
    <div id="status">MQTT: Connecting to Broker...</div>
    <div id="title-overlay">
        <h1>3D HVAC Digital Twin</h1>
        <p>Live Environment Sync</p>
    </div>
    <div id="canvas-container"></div>
</div>

<div id="right-panel">
    <div class="card grid">
        <div>
            <h2>Room Apparent Temp</h2>
            <div id="temp-val" class="metric">-- °C</div>
        </div>
        <div>
            <h2>Real-time Energy Draw</h2>
            <div id="power-val" class="metric" style="color: #fbbf24;">-- W</div>
        </div>
    </div>
    <div class="card chart-container">
        <canvas id="tempChart"></canvas>
    </div>
    <div class="card chart-container">
        <canvas id="powerChart"></canvas>
    </div>
</div>

<script>
    // --------------------------------------------------------
    // 1. 3D SCENE SETUP (THREE.JS)
    // --------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    
    // Camera
    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(12, 10, 15);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Wireframe Room
    const roomGeometry = new THREE.BoxGeometry(12, 8, 12);
    const edges = new THREE.EdgesGeometry(roomGeometry);
    const roomLines = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.5 }));
    roomLines.position.y = 4;
    scene.add(roomLines);

    // Solid Floor
    const floorGeo = new THREE.PlaneGeometry(12, 12);
    const floorMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = Math.PI / 2;
    scene.add(floor);

    // Heating Element (PTC Box)
    const heaterGeo = new THREE.BoxGeometry(2, 1.5, 1);
    const heaterMat = new THREE.MeshPhongMaterial({ color: 0x222222, emissive: 0x000000 });
    const heater = new THREE.Mesh(heaterGeo, heaterMat);
    heater.position.set(-3, 0.75, 3);
    scene.add(heater);

    // Blower Fan / Ventilation Duct
    const fanGroup = new THREE.Group();
    const ductGeo = new THREE.CylinderGeometry(1, 1, 2.5, 32);
    const ductMat = new THREE.MeshPhongMaterial({ color: 0x64748b, transparent: true, opacity: 0.7 });
    const duct = new THREE.Mesh(ductGeo, ductMat);
    duct.rotation.x = Math.PI / 2;
    fanGroup.add(duct);

    // Fan Blades
    const bladesGeo = new THREE.BoxGeometry(1.8, 0.1, 0.2);
    const bladesMat = new THREE.MeshPhongMaterial({ color: 0x38bdf8 });
    const blade1 = new THREE.Mesh(bladesGeo, bladesMat);
    const blade2 = new THREE.Mesh(bladesGeo, bladesMat);
    blade2.rotation.y = Math.PI / 2;
    
    const fanRotor = new THREE.Group();
    fanRotor.add(blade1);
    fanRotor.add(blade2);
    fanRotor.position.z = 1.25;
    fanGroup.add(fanRotor);
    
    fanGroup.position.set(3, 6, -4);
    scene.add(fanGroup);

    // Ambient and Dynamic Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0x00aaff, 1, 25); 
    pointLight.position.set(0, 6, 0);
    scene.add(pointLight);

    // Resize Handler
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Animation Loop
    let currentFanSpeed = 0;
    function animate() {
        requestAnimationFrame(animate);
        fanRotor.rotation.z -= currentFanSpeed; // Spin the fan blades
        renderer.render(scene, camera);
    }
    animate();

    // --------------------------------------------------------
    // 2. LIVE TELEMETRY CHARTS (CHART.JS)
    // --------------------------------------------------------
    const maxDataPoints = 30; // Rolling window of 30 seconds
    const timeLabels = [];
    const tempData = [];
    const setpointData = [];
    const powerData = [];

    const tempCtx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(tempCtx, {
        type: 'line',
        data: {
            labels: timeLabels,
            datasets: [
                { label: 'Live Room Temp (°C)', data: tempData, borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.15)', fill: true, tension: 0.3, pointRadius: 2 },
                { label: 'PID Setpoint', data: setpointData, borderColor: '#10b981', borderDash: [5, 5], fill: false, tension: 0, pointRadius: 0 }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, animation: { duration: 200 }, scales: { y: { suggestedMin: 15, suggestedMax: 30 }, x: { grid: { display: false } } } }
    });

    const powerCtx = document.getElementById('powerChart').getContext('2d');
    const powerChart = new Chart(powerCtx, {
        type: 'bar',
        data: {
            labels: timeLabels,
            datasets: [{ label: 'Energy Usage Optimization (Watts)', data: powerData, backgroundColor: '#fbbf24', borderRadius: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, animation: { duration: 200 }, scales: { y: { suggestedMin: 0, suggestedMax: 70 }, x: { grid: { display: false } } } }
    });

    // --------------------------------------------------------
    // 3. MQTT WEBSOCKET CONNECTION
    // --------------------------------------------------------
    const statusEl = document.getElementById('status');
    const tempValEl = document.getElementById('temp-val');
    const powerValEl = document.getElementById('power-val');

    // Connect to the public HiveMQ websocket broker
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
        statusEl.innerHTML = '🟢 MQTT: Live Sync Active';
        statusEl.style.borderColor = '#10b981';
        // Subscribe to the ESP32's telemetry topic
        client.subscribe('ece441/group2/hvac/telemetry');
    });

    client.on('message', (topic, message) => {
        try {
            const data = JSON.parse(message.toString());
            
            // 1. Update Numeric UI Texts
            tempValEl.innerText = data.apparent.toFixed(1) + ' °C';
            powerValEl.innerText = data.power.toFixed(1) + ' W';

            // 2. Update 3D Digital Twin Models
            // Fan speed (PWM 0-255 maps to rotation speed)
            currentFanSpeed = (data.fan_pwm / 255.0) * 0.8;
            
            // Heater glow (PWM 0-255 maps to Red Emissive Glow)
            const heaterIntensity = data.heater_pwm / 255.0;
            heaterMat.emissive = new THREE.Color(heaterIntensity, 0, 0);

            // Room ambient color (Blue = cold ~15C, Red = hot ~30C)
            const normalizedTemp = Math.max(0, Math.min(1, (data.apparent - 15) / 15));
            pointLight.color = new THREE.Color(normalizedTemp, 0.2, 1.0 - normalizedTemp);

            // 3. Update Chart.js Rolling Arrays
            const now = new Date();
            const timeStr = now.getSeconds().toString().padStart(2, '0') + 's';
            
            timeLabels.push(timeStr);
            tempData.push(data.apparent);
            setpointData.push(25.0); // Demo default setpoint
            powerData.push(data.power);

            if (timeLabels.length > maxDataPoints) {
                timeLabels.shift();
                tempData.shift();
                setpointData.shift();
                powerData.shift();
            }

            tempChart.update();
            powerChart.update();

        } catch(e) {
            console.error("Payload Parse Error:", e);
        }
    });
</script>
</body>
</html>
