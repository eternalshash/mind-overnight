; ============================================================================
; ECE 441 Smart HVAC Control - Dual-Target PlatformIO Configuration
; ============================================================================
; 1. [env:uno_bench]   -> Wokwi Simulator & Standard Arduino Uno (ATmega328P)
; 2. [env:uno_r4_wifi] -> Physical Lab Bench Arduino Uno R4 WiFi (Andy & Kaleb)
; 3. [env:esp32dev]    -> Legacy ESP32 Simulation Target
; ============================================================================

[platformio]
default_envs = uno_bench

[env:uno_bench]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<bench_main.cpp> -<main.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    br3ttb/PID @ ^1.2.1

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<bench_main.cpp> -<main.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    br3ttb/PID @ ^1.2.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp> -<bench_main.cpp>
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    br3ttb/PID @ ^1.2.1
build_flags = 
    -D CORE_DEBUG_LEVEL=0
