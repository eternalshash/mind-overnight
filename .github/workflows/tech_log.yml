name: Auto-Update HVAC Technical Log

on:
  workflow_dispatch:
  push:
    paths:
      - 'code/ECE441/SmartHVAC_Sim/**'
    branches:
      - main
      - develop

concurrency:
  group: tech-log-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-log:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install google-genai

      - name: Update Technical Log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEFORE_COMMIT: ${{ github.event.before }}
          AFTER_COMMIT: ${{ github.event.after }}
        run: |
          python3 .github/scripts/update_technical_log.py --range "$BEFORE_COMMIT" "$AFTER_COMMIT"

      - name: Commit and Push Log Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add code/ECE441/SmartHVAC_Sim/TECHNICAL_LOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit in TECHNICAL_LOG.md."
            exit 0
          fi
          git commit -m "docs(hvac): auto-update technical log [skip ci]"
          # Other pushes may land on the branch while this job runs; rebase onto
          # the latest remote and retry instead of failing on non-fast-forward.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed technical log update (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push technical log update after 5 attempts." >&2
          exit 1
